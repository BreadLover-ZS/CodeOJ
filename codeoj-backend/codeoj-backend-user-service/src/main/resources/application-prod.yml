# 生产环境配置文件
spring:
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://codeoj-mysql:3306/codeoj}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:Mysql@2026Code}
  # Redis 配置
  redis:
    database: 1
    host: ${REDIS_HOST:codeoj-redis}
    port: 6379
    password: ${REDIS_PASSWORD:Redis@2026Code}
    timeout: 5000
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:codeoj-nacos:8848}
  rabbitmq:
    host: ${RABBITMQ_HOST:codeoj-rabbitmq}
    port: 5672
    password: ${RABBITMQ_PASSWORD:Rabbit@2026Code}
    username: ${RABBITMQ_USERNAME:codeoj}
# 安全：生产环境关闭 Swagger/Knife4j 文档
knife4j:
  enable: false