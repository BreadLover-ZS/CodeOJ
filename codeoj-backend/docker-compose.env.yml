version: '3'
services:
  mysql:
    image: mysql:8 # 使用的镜像
    container_name: codeoj-mysql # 启动的实例名称
    environment:
      # 安全：root 密码通过环境变量注入（可用 .env 文件覆盖），禁止使用弱口令
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Mysql@2026Code}
    ports:
      - "3306:3306" # 端口映射（本地开发调试用；生产环境请注释或改为仅内网访问）
    volumes:
      - ./.mysql-data:/var/lib/mysql # 将数据目录挂载到本地目录以进行持久化
      - ./mysql-init:/docker-entrypoint-initdb.d # 启动脚本
    restart: always # 崩溃后自动重启
    # 就绪探针：仅在能以 root 身份 ping 通后才 healthy（首次初始化期间 start_period 兜底）
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mynetwork # 指定网络
  redis:
    image: redis:6
    container_name: codeoj-redis
    # 安全：Redis 设置访问密码（同时注入为容器内环境变量供健康检查使用）
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Redis@2026Code}
    command: redis-server --requirepass ${REDIS_PASSWORD:-Redis@2026Code} --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - mynetwork
    volumes:
      - ./.redis-data:/data # 持久化
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  rabbitmq:
    image: rabbitmq:3.12.6-management # 支持管理面板的消息队列
    container_name: codeoj-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-codeoj}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-Rabbit@2026Code}
    ports:
      - "5672:5672"
      # 安全：15672 管理台默认不对外发布（可注释本行启用）
      # - "15672:15672" # RabbitMQ Dashboard 端口
    volumes:
      - ./.rabbitmq-data:/var/lib/rabbitmq # 持久化
    networks:
      - mynetwork
    # 就绪探针：rabbitmq-diagnostics ping 成功表示 Erlang 节点与应用均已就绪
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
  nacos:
    image: nacos/nacos-server:v2.2.0-slim
    container_name: codeoj-nacos
    ports:
      - "8848:8848"
      # Nacos 2.x 客户端通过 gRPC 通信，需要额外暴露 8848+1000 / +1001 端口
      - "9848:9848"
      - "9849:9849"
    volumes:
      # Windows 绑定挂载(virtiofs)上内嵌 Derby 初始化会 IO 超时，改用 Docker 命名卷
      - nacos-data:/home/nacos/data
    networks:
      - mynetwork
    environment:
      - MODE=standalone # 单节点模式启动
      - PREFER_HOST_MODE=hostname # 支持 hostname
      - TZ=Asia/Shanghai # 控制时区
      # 安全：Nacos 控制台默认账号 nacos/nacos，生产环境请务必修改
      - NACOS_AUTH_ENABLE=false
    # 就绪探针：slim 镜像无 curl/wget，用 bash 的 /dev/tcp 请求 readiness 接口（返回纯文本 OK）
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8848 && printf 'GET /nacos/v1/console/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q OK <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
networks:
  mynetwork:
volumes:
  nacos-data: