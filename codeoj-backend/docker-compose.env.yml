version: '3'
services:
  mysql:
    image: mysql:8 # 使用的镜像
    container_name: codeoj-mysql # 启动的实例名称
    environment:
      # 安全：root 密码通过环境变量注入（可用 .env 文件覆盖），禁止使用弱口令
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Mysql@2026Code}
    ports:
      - "3306:3306" # 端口映射（本地开发调试用；生产环境请注释或改为仅内网访问）
    volumes:
      - ./.mysql-data:/var/lib/mysql # 将数据目录挂载到本地目录以进行持久化
      - ./mysql-init:/docker-entrypoint-initdb.d # 启动脚本
    restart: always # 崩溃后自动重启
    networks:
      - mynetwork # 指定网络
  redis:
    image: redis:6
    container_name: codeoj-redis
    # 安全：Redis 设置访问密码
    command: redis-server --requirepass ${REDIS_PASSWORD:-Redis@2026Code} --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - mynetwork
    volumes:
      - ./.redis-data:/data # 持久化
  rabbitmq:
    image: rabbitmq:3.12.6-management # 支持管理面板的消息队列
    container_name: codeoj-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-codeoj}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-Rabbit@2026Code}
    ports:
      - "5672:5672"
      # 安全：15672 管理台默认不对外发布（可注释本行启用）
      # - "15672:15672" # RabbitMQ Dashboard 端口
    volumes:
      - ./.rabbitmq-data:/var/lib/rabbitmq # 持久化
    networks:
      - mynetwork
  nacos:
    image: nacos/nacos-server:v2.2.0-slim
    container_name: codeoj-nacos
    ports:
      - "8848:8848"
    volumes:
      - ./.nacos-data:/home/nacos/data
    networks:
      - mynetwork
    environment:
      - MODE=standalone # 单节点模式启动
      - PREFER_HOST_MODE=hostname # 支持 hostname
      - TZ=Asia/Shanghai # 控制时区
      # 安全：Nacos 控制台默认账号 nacos/nacos，生产环境请务必修改
      - NACOS_AUTH_ENABLE=false
networks:
  mynetwork: