spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      routes:
        - id: codeoj-backend-user-service
          uri: lb://codeoj-backend-user-service
          predicates:
            - Path=/api/user/**
        - id: codeoj-backend-question-service
          uri: lb://codeoj-backend-question-service
          predicates:
            - Path=/api/question/**
        - id: codeoj-backend-judge-service
          uri: lb://codeoj-backend-judge-service
          predicates:
            - Path=/api/judge/**
  application:
    name: codeoj-backend-gateway
  main:
    web-application-type: reactive
server:
  port: 8101
knife4j:
  gateway:
    # ① 第一个配置，开启gateway聚合组件
    enabled: true
    # ② 第二行配置，设置聚合模式采用discover服务发现的模式
    strategy: discover
    discover:
      # ③ 第三行配置，开启discover模式
      enabled: true
      # ④ 第四行配置，聚合子服务全部为Swagger2规范的文档
      version: swagger2
# 内部接口（/inner/**）鉴权密钥与 CORS 白名单，生产环境务必通过环境变量覆盖
codeoj:
  inner-auth-secret: ${INNER_AUTH_SECRET:codeoj-default-inner-secret}
  # 允许跨域的来源（逗号分隔）：8000 为 yarn serve 自定义端口，8080 为 Vue CLI 默认 dev 端口
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8000,http://localhost:8080}